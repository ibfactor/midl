<!DOCTYPE html>
<html>
	<head>
		<title>MIDL</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Cal+Sans&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');


			#flash-container, ruffle-player {
				position: fixed;
				width: 100%;
				height: 100%;
				left: 0;
				top: 0;
			}
			#info {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				font-family: "Cal sans";
				background: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 10px;
				border-radius: 5px;
				transition: all 0.2s;
				display: none;
				opacity: 0;
			}
			#info h3, #info p {
				margin: 0;
			}
			#info h3 {
				backdrop-filter: blur(3px);
				text-align: center;
			}
		</style>
	</head>
	<body>

		<div id="flash-container"></div>

		<div id="info">
			<h3>Information</h3>
			<p>Links are disabled by default due to security issues.</p>
		</div>

		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
		<script>
			(() => {
			    const originalInstantiate = WebAssembly.instantiate;
			    const originalStreaming = WebAssembly.instantiateStreaming;

			    window.__ruffleWasm = null;

			    WebAssembly.instantiate = async function (...args) {
			        const result = await originalInstantiate.apply(this, args);

			        const instance =
			            result instanceof WebAssembly.Instance
			                ? result
			                : result.instance;

			        if (instance) {
			            console.log("WASM INSTANCE CAPTURED");
			            console.log("Exports:", instance.exports);

			            window.__ruffleWasm = instance;
			        }

			        return result;
			    };

			    WebAssembly.instantiateStreaming = async function (...args) {
			        const result = await originalStreaming.apply(this, args);

			        console.log("WASM STREAMING INSTANCE CAPTURED");
			        console.log("Exports:", result.instance.exports);

			        window.__ruffleWasm = result.instance;

			        return result;
			    };

			    console.log("WASM interception installed");
			})();


			let ruffleState = null;
			let ruffleRestoreBusy = false;

			function getWasm() {
			    return window.__ruffleWasm;
			}

			function getMemory() {
			    const memory = getWasm().exports.memory;
			    return memory;
			}

			function findRuffleCanvas() {
			    return document.querySelector("ruffle-player canvas, canvas");
			}

			function getGL(canvas) {
			    if (!canvas) return null;

			    return (
			        canvas.getContext("webgl2") ||
			        canvas.getContext("webgl") ||
			        canvas.getContext("experimental-webgl")
			    );
			}

			function nextFrame() {
			    return new Promise(resolve => {
			        requestAnimationFrame(resolve);
			    });
			}

			window.saveRuffleState = () => {
			    const memory = getMemory();

			    ruffleState = {
			        memory: memory.buffer.slice(0),
			        pages: memory.buffer.byteLength / 65536
			    };
			};

			window.loadRuffleState = async () => {
			    if (!ruffleState || ruffleRestoreBusy) return;

			    ruffleRestoreBusy = true;

			    try {
			        player.pause();

			        await nextFrame();

			        const memory = getMemory();

			        const current = new Uint8Array(memory.buffer);

			        const saved =
			            ruffleState.memory instanceof ArrayBuffer
			                ? new Uint8Array(ruffleState.memory)
			                : new Uint8Array(ruffleState);

			        current.set(saved);

			        const canvas = findRuffleCanvas();
			        const gl = getGL(canvas);

			        if (gl) {
			            gl.bindBuffer(gl.ARRAY_BUFFER, null);
			            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
			            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
			            gl.bindRenderbuffer(gl.RENDERBUFFER, null);
			            gl.useProgram(null);

			            gl.disable(gl.BLEND);
			            gl.disable(gl.DEPTH_TEST);
			            gl.disable(gl.SCISSOR_TEST);
			            gl.disable(gl.CULL_FACE);
			            gl.disable(gl.STENCIL_TEST);

			            gl.flush();
			        }

			        await nextFrame();

			        player.play();

			    } catch (e) {
			        console.error("Error", e);

			    } finally {
			        ruffleRestoreBusy = false;
			    }
			};

			window.downloadRuffleState = () => {

			    if (!ruffleState) {
			        return;
			    }

			    try {
			        const buffer =
			            ruffleState.memory instanceof ArrayBuffer
			                ? ruffleState.memory
			                : ruffleState;

			        const blob = new Blob(
			            [buffer],
			            {
			                type: "application/octet-stream"
			            }
			        );

			        const url = URL.createObjectURL(blob);

			        const a = document.createElement("a");

			        a.href = url;
			        a.download = "ruffle-save.bin";

			        document.body.appendChild(a);
			        a.click();
			        a.remove();

			        setTimeout(() => {
			            URL.revokeObjectURL(url);
			        }, 1000);

			        console.log("⬇️ Ruffle state downloaded.");

			    } catch (e) {
			        console.error("Download failed:", e);
			    }
			};

			window.uploadRuffleState = () => {

			    const input = document.createElement("input");

			    input.type = "file";
			    input.accept = ".bin,application/octet-stream";

			    input.onchange = async () => {

			        const file = input.files?.[0];

			        if (!file) return;

			        try {
			            const buffer = await file.arrayBuffer();

			            ruffleState = {
			                memory: buffer,
			                pages: buffer.byteLength / 65536
			            };

			            console.log(
			                `📂 Loaded ${buffer.byteLength.toLocaleString()} bytes`
			            );

			            await window.loadRuffleState();

			        } catch (e) {
			            console.error("Upload/restore failed:", e);
			        }
			    };

			    input.click();
			};


			document.addEventListener("contextmenu", (e) => {
			    if (e.target.closest("ruffle-player") || e.target.closest("embed")) {
			        e.preventDefault();
			        e.stopPropagation();
			    }
			}, true);

			window.open = function() {
				document.getElementById("info").style.display = "block";
				setTimeout(() => {
					document.getElementById("info").style.opacity = "1";
				}, 200);
				setTimeout(() => {
					document.getElementById("info").style.opacity = "0";
				}, 1000);
				setTimeout(() => {
					document.getElementById("info").style.display = "none";
				}, 1200);
			};

			setInterval(() => {
				if (!player.shadowRoot.getElementById("play-button")) return;
				player.shadowRoot.getElementById("play-button").style.display = "none";
				if (!player.isPlaying) {
					player.style.pointerEvents = "none";
				}
				else {
					player.style.pointerEvents = "auto";
				}
			}, 50);

			const ruffle = window.RufflePlayer.newest();

			window.player = ruffle.createPlayer();


			const container = document.getElementById("flash-container");
			container.appendChild(player);
		</script>
	</body>
</html>
