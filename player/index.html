<!DOCTYPE html>
<html>
	<head>
		<title>MIDL</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Cal+Sans&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

			html, body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
			}
			#flash-container {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
			}

			ruffle-player {
				display: block;
				width: 100%;
				height: 100%;
				max-width: 100%;
				max-height: 100%;
			}

			#info {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				font-family: "Cal sans";
				background: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 10px;
				border-radius: 5px;
				transition: all 0.2s;
				display: none;
				opacity: 0;
			}
			#info h3, #info p {
				margin: 0;
			}
			#info h3 {
				backdrop-filter: blur(3px);
				text-align: center;
			}

			iframe {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 50;
				border: 0;
			}

			#pausedTitle {
				position: fixed;
				top: -100%;
				left: 50%;
				transform: translate(-50%, -50%);
				color: white;
				font-family: "Cal Sans";
				text-stroke: 1px black;
				-webkit-text-stroke: 1px black;
				font-weight: 900;
				font-size: 40px;
				transition: all 0.2s;
			}
			#pausedTitle i {
				text-stroke: 2px black;
				-webkit-text-stroke: 2px black;
				margin-right: 8px;
			}
			#pausedTitle.active {
				top: 50%;
			}
		</style>
	</head>
	<body>

		<div id="flash-container"></div>

		<iframe src="/player/static.html"></iframe>

		<div id="info">
			<h3>Information</h3>
			<p>Links are disabled by default due to security issues.</p>
		</div>

		<h2 id="pausedTitle"><i class="fas fa-pause"></i> PAUSED</h2>

		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
		<script>
			document.addEventListener("contextmenu", (e) => {
			    if (e.target.closest("ruffle-player") || e.target.closest("embed")) {
			        e.preventDefault();
			        e.stopPropagation();
			    }
			}, true);

			window.open = function() {
				document.getElementById("info").style.display = "block";
				setTimeout(() => {
					document.getElementById("info").style.opacity = "1";
				}, 200);
				setTimeout(() => {
					document.getElementById("info").style.opacity = "0";
				}, 1000);
				setTimeout(() => {
					document.getElementById("info").style.display = "none";
				}, 1200);
			};

			setInterval(() => {
				if (!player.shadowRoot.getElementById("play-button")) return;
				player.shadowRoot.getElementById("play-button").style.display = "none";
				if (!player.isPlaying) {
					player.style.pointerEvents = "none";
					document.getElementById("pausedTitle").classList.add("active");
				}
				else {
					player.style.pointerEvents = "auto";
					document.getElementById("pausedTitle").classList.remove("active");
				}
			}, 50);

			const ruffle = window.RufflePlayer.newest();
			window.player = ruffle.createPlayer();

			window.player.config = {
			    allowScriptAccess: true,
			};

			const container = document.getElementById("flash-container");
			container.appendChild(player);


			player.addEventListener("loadedmetadata", () => {
			    window.parent.postMessage({type: "ruffle-loaded"}, "*");
			    document.querySelector("iframe").style.display = "block";
			    player.pause();
			    document.querySelector("iframe").src = "/player/intro.html";
			    setTimeout(() => {
			    	player.play();
			    }, 6000);
			    setTimeout(() => {
			    	document.querySelector("iframe").style.display = "none";
			    }, 6200);
			});

		</script>
	</body>
</html>
