<!DOCTYPE html>
<html>
	<head>
		<title>MIDL</title>
		<link rel="stylesheet" href="/main.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	</head>
	<body class="dark">

		<div id="banner">
			<p>The most fun place on the internet is back.</p><p>Say hi 👋 to the new MIDL</p>
		</div>

		<div id="content">
			
			<div id="main">
				<h3>MIDL</h3>
				<button id="home_button"><i class="fas fa-house"></i></button><button id="search_button"><i class="fas fa-magnifying-glass"></i></button>
			</div>
			
		</div>

		<div id="search">
			<span><i class="fas fa-magnifying-glass"></i></span>
			<input type="text" placeholder="Start typing...">
			<div id="results">
				<hr>
			</div>
		</div>

		<div id="game">
			<div id="player">
				<h6 id="top"></h6>
				<iframe src="/player"></iframe>
				<div id="controls">
					<button id="playpause_btn"><i class="fas fa-pause"></i>&nbsp;&nbsp;Pause</button><button id="fullscreen_btn"><i class="fas fa-expand"></i>&nbsp;&nbsp;Fullscreen</button>
				</div>
			</div>
		</div>

		<div id="loading_screen">
			<p></p>
			<div>
				<img src="/wave-spinner.gif">
				<p>Spinning up great things...</p>
			</div>
			<p></p>
		</div>

		<script src="/scripts/render.js"></script>
		<script src="/scripts/styles.js"></script>
		<script src="/scripts/player.js"></script>
	</body>
</html>
